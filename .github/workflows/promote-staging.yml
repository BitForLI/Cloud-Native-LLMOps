name: Promote Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact master commit SHA already deployed to development
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-staging
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/master'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PAGER: ""
      DEV_API_ECR_REPOSITORY: ${{ vars.DEV_API_ECR_REPOSITORY }}
      DEV_WORKER_ECR_REPOSITORY: ${{ vars.DEV_WORKER_ECR_REPOSITORY }}
      STAGING_API_ECR_REPOSITORY: ${{ vars.STAGING_API_ECR_REPOSITORY }}
      STAGING_WORKER_ECR_REPOSITORY: ${{ vars.STAGING_WORKER_ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      API_ECS_SERVICE: ${{ vars.API_ECS_SERVICE }}
      WORKER_ECS_SERVICE: ${{ vars.WORKER_ECS_SERVICE }}
      API_URL: ${{ vars.API_URL }}
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Validate immutable revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "image_tag must be a full commit SHA" >&2; exit 1; }

      - name: Check out promoted revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.image_tag }}
          persist-credentials: false

      - name: Require successful master CI for revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          successful_runs=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" -f head_sha="$IMAGE_TAG" -f branch=master -f event=push -f status=success --jq '.total_count')
          [[ "$successful_runs" -ge 1 ]] || { echo "No successful master CI run found for ${IMAGE_TAG}" >&2; exit 1; }
          dev_run_id=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-dev.yml/runs" -f branch=master -f event=workflow_run -f status=success -f per_page=100 --jq ".workflow_runs | map(select(.display_title == \"Deploy Development ${IMAGE_TAG}\")) | first | .id // empty")
          [[ -n "$dev_run_id" ]] || { echo "No successful development delivery run found for ${IMAGE_TAG}" >&2; exit 1; }
          successful_deploy_jobs=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${dev_run_id}/jobs" --jq '[.jobs[] | select(.name == "deploy" and .conclusion == "success")] | length')
          [[ "$successful_deploy_jobs" -eq 1 ]] || { echo "Development deploy job did not succeed for ${IMAGE_TAG}" >&2; exit 1; }

      - name: Configure short-lived staging credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Promote exact image digests and verify staging
        shell: bash
        run: bash .github/scripts/promote-staging.sh

      - name: Publish promotion summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Staging promotion"
            echo "- Commit: \`${IMAGE_TAG}\`"
            echo "- Environment: protected \`staging\`"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
