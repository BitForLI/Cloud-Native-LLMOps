name: Staging Performance Gate
run-name: Staging Performance ${{ inputs.image_tag }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact master commit SHA currently promoted to staging
        required: true
        type: string
      duration_seconds:
        description: Sustained test duration from 30 through 900 seconds
        required: true
        default: "120"
        type: string
      requests_per_second:
        description: Target inference requests per second from 0.1 through 100
        required: true
        default: "2"
        type: string
      concurrency:
        description: Maximum in-flight requests from 1 through 200
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: staging-performance
  cancel-in-progress: false

jobs:
  performance:
    if: github.ref == 'refs/heads/master'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PAGER: ""
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      API_ECS_SERVICE: ${{ vars.API_ECS_SERVICE }}
      API_URL: ${{ vars.API_URL }}
      API_AUTH_SECRET_ID: ${{ vars.API_AUTH_SECRET_ID }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      REQUESTS_PER_SECOND: ${{ inputs.requests_per_second }}
      LOAD_CONCURRENCY: ${{ inputs.concurrency }}

    steps:
      - name: Validate bounded load request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "image_tag must be a full commit SHA" >&2; exit 1; }
          [[ "$DURATION_SECONDS" =~ ^[0-9]+$ ]] || { echo "duration_seconds must be an integer" >&2; exit 1; }
          (( DURATION_SECONDS >= 30 && DURATION_SECONDS <= 900 )) || { echo "duration_seconds is outside 30-900" >&2; exit 1; }
          [[ "$REQUESTS_PER_SECOND" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "requests_per_second must be numeric" >&2; exit 1; }
          [[ "$LOAD_CONCURRENCY" =~ ^[0-9]+$ ]] || { echo "concurrency must be an integer" >&2; exit 1; }
          (( LOAD_CONCURRENCY >= 1 && LOAD_CONCURRENCY <= 200 )) || { echo "concurrency is outside 1-200" >&2; exit 1; }
          for required in AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN AWS_REGION ECS_CLUSTER API_ECS_SERVICE API_URL API_AUTH_SECRET_ID; do
            [[ -n "${!required:-}" ]] || { echo "Missing staging variable: ${required}" >&2; exit 1; }
          done

      - name: Check out tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.image_tag }}
          persist-credentials: false

      - name: Require successful staging promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          promotion_count=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/promote-staging.yml/runs" -f branch=master -f event=workflow_dispatch -f status=success -f per_page=100 --jq "[.workflow_runs[] | select(.display_title == \"Promote Staging ${IMAGE_TAG}\")] | length")
          [[ "$promotion_count" -ge 1 ]] || { echo "No successful staging promotion found for ${IMAGE_TAG}" >&2; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install pinned load client
        run: python -m pip install httpx==0.28.1

      - name: Configure short-lived staging credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: staging-load-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Verify exact revision and readiness
        shell: bash
        run: |
          set -euo pipefail
          task_definition=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$API_ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          [[ -n "$task_definition" && "$task_definition" != "None" ]] || { echo "Staging API task definition not found" >&2; exit 1; }
          deployed_image=$(aws ecs describe-task-definition --task-definition "$task_definition" --query "taskDefinition.containerDefinitions[?name=='api'].image | [0]" --output text)
          [[ "$deployed_image" == *":${IMAGE_TAG}" ]] || { echo "Staging API is not running ${IMAGE_TAG}" >&2; exit 1; }
          curl --fail --silent --show-error --max-time 15 "${API_URL%/}/health" >/dev/null
          curl --fail --silent --show-error --max-time 15 "${API_URL%/}/ready" >/dev/null

      - name: Run bounded performance gate
        shell: bash
        run: |
          set -euo pipefail
          API_AUTH_TOKEN=$(aws secretsmanager get-secret-value --secret-id "$API_AUTH_SECRET_ID" --query SecretString --output text)
          [[ ${#API_AUTH_TOKEN} -ge 32 ]] || { echo "Staging API token is not populated" >&2; exit 1; }
          echo "::add-mask::${API_AUTH_TOKEN}"
          export API_AUTH_TOKEN
          python -m loadtests.run_load \
            --url "$API_URL" \
            --duration-seconds "$DURATION_SECONDS" \
            --requests-per-second "$REQUESTS_PER_SECOND" \
            --concurrency "$LOAD_CONCURRENCY" \
            --max-error-rate 0.01 \
            --max-p95-latency-ms 3000 \
            --min-throughput-ratio 0.90 \
            --output load-test-report.json

      - name: Upload prompt-free performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-performance-${{ inputs.image_tag }}-${{ github.run_id }}
          path: load-test-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish performance summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report_path = Path("load-test-report.json")
          print("### Staging performance gate")
          print(f"- Commit: `${{ inputs.image_tag }}`")
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              results = report["results"]
              print(f"- Requests: `{results['requests']}`")
              print(f"- Error rate: `{results['error_rate']:.2%}`")
              print(f"- P95 latency: `{results['latency_ms']['p95']:.2f} ms`")
              print(f"- Achieved throughput: `{results['achieved_requests_per_second']:.3f} req/s`")
              print(f"- Gate: **{'PASS' if report['gate']['passed'] else 'FAIL'}**")
          else:
              print("- Gate: **NO REPORT**")
          print("- Job result: **${{ job.status }}**")
          PY
