name: Release Production
run-name: Release Production ${{ inputs.image_tag }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Exact commit SHA successfully promoted to staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PAGER: ""
      STAGING_API_ECR_REPOSITORY: ${{ vars.STAGING_API_ECR_REPOSITORY }}
      STAGING_WORKER_ECR_REPOSITORY: ${{ vars.STAGING_WORKER_ECR_REPOSITORY }}
      PRODUCTION_API_ECR_REPOSITORY: ${{ vars.PRODUCTION_API_ECR_REPOSITORY }}
      PRODUCTION_WORKER_ECR_REPOSITORY: ${{ vars.PRODUCTION_WORKER_ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      API_ECS_SERVICE: ${{ vars.API_ECS_SERVICE }}
      WORKER_ECS_SERVICE: ${{ vars.WORKER_ECS_SERVICE }}
      API_URL: ${{ vars.API_URL }}
      API_AUTH_SECRET_ID: ${{ vars.API_AUTH_SECRET_ID }}
      CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION }}
      CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP }}
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Validate immutable release revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "image_tag must be a full commit SHA" >&2; exit 1; }

      - name: Check out released revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.image_tag }}
          persist-credentials: false

      - name: Require successful staging gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          staging_run_id=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/promote-staging.yml/runs" -f branch=master -f event=workflow_dispatch -f status=success -f per_page=100 --jq ".workflow_runs | map(select(.display_title == \"Promote Staging ${IMAGE_TAG}\")) | first | .id // empty")
          [[ -n "$staging_run_id" ]] || { echo "No successful staging promotion found for ${IMAGE_TAG}" >&2; exit 1; }
          successful_promotion_jobs=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${staging_run_id}/jobs" --jq '[.jobs[] | select(.name == "promote" and .conclusion == "success")] | length')
          [[ "$successful_promotion_jobs" -eq 1 ]] || { echo "Staging promotion job did not succeed for ${IMAGE_TAG}" >&2; exit 1; }
          performance_run_id=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/performance-staging.yml/runs" -f branch=master -f event=workflow_dispatch -f status=success -f per_page=100 --jq ".workflow_runs | map(select(.display_title == \"Staging Performance ${IMAGE_TAG}\")) | first | .id // empty")
          [[ -n "$performance_run_id" ]] || { echo "No successful staging performance gate found for ${IMAGE_TAG}" >&2; exit 1; }
          successful_performance_jobs=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${performance_run_id}/jobs" --jq '[.jobs[] | select(.name == "performance" and .conclusion == "success")] | length')
          [[ "$successful_performance_jobs" -eq 1 ]] || { echo "Staging performance job did not succeed for ${IMAGE_TAG}" >&2; exit 1; }

      - name: Configure short-lived production credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Promote artifacts and execute production canary
        shell: bash
        run: bash .github/scripts/promote-production.sh

      - name: Publish release summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Production release"
            echo "- Commit: \`${IMAGE_TAG}\`"
            echo "- Strategy: **10% canary, then 100%**"
            echo "- Environment: protected \`production\`"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
