name: Diagnose Production Incident
run-name: Diagnose ${{ inputs.incident_id }}

on:
  workflow_dispatch:
    inputs:
      incident_id:
        description: Non-secret incident identifier, for example INC-2026-001
        required: true
        type: string
      lookback_hours:
        description: Diagnostic window from 1 through 168 hours
        required: true
        default: "6"
        type: string

permissions:
  contents: read

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/master'
    environment: production-operations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_OPERATIONS_ROLE_ARN: ${{ vars.AWS_OPERATIONS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PAGER: ""
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      API_ECS_SERVICE: ${{ vars.API_ECS_SERVICE }}
      WORKER_ECS_SERVICE: ${{ vars.WORKER_ECS_SERVICE }}
      INFERENCE_QUEUE_URL: ${{ vars.INFERENCE_QUEUE_URL }}
      DEAD_LETTER_QUEUE_URL: ${{ vars.DEAD_LETTER_QUEUE_URL }}
      ALARM_NAME_PREFIX: ${{ vars.ALARM_NAME_PREFIX }}
      AUDIT_TRAIL_NAME: ${{ vars.AUDIT_TRAIL_NAME }}
      BACKUP_VAULT_NAME: ${{ vars.BACKUP_VAULT_NAME }}
      RESTORE_TESTING_PLAN_ARN: ${{ vars.RESTORE_TESTING_PLAN_ARN }}
      CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION }}
      CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP }}
      INCIDENT_ID: ${{ inputs.incident_id }}
      LOOKBACK_HOURS: ${{ inputs.lookback_hours }}

    steps:
      - name: Validate incident request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INCIDENT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9-]{2,63}$ ]] || { echo "incident_id must be 3-64 alphanumeric or hyphen characters" >&2; exit 1; }
          [[ "$LOOKBACK_HOURS" =~ ^[0-9]+$ ]] || { echo "lookback_hours must be an integer" >&2; exit 1; }
          (( LOOKBACK_HOURS >= 1 && LOOKBACK_HOURS <= 168 )) || { echo "lookback_hours is outside 1-168" >&2; exit 1; }
          for required in AWS_ACCOUNT_ID AWS_OPERATIONS_ROLE_ARN AWS_REGION ECS_CLUSTER API_ECS_SERVICE WORKER_ECS_SERVICE INFERENCE_QUEUE_URL DEAD_LETTER_QUEUE_URL ALARM_NAME_PREFIX AUDIT_TRAIL_NAME BACKUP_VAULT_NAME RESTORE_TESTING_PLAN_ARN CODEDEPLOY_APPLICATION CODEDEPLOY_DEPLOYMENT_GROUP; do
            [[ -n "${!required:-}" ]] || { echo "Missing production-operations variable: ${required}" >&2; exit 1; }
          done

      - name: Check out diagnostic collector
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install pinned AWS client
        run: python -m pip install boto3==1.43.55

      - name: Configure read-only production credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_OPERATIONS_ROLE_ARN }}
          role-session-name: incident-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Collect read-only diagnostics
        shell: bash
        run: |
          python .github/scripts/collect_production_diagnostics.py \
            --incident-id "$INCIDENT_ID" \
            --lookback-hours "$LOOKBACK_HOURS" \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --api-service "$API_ECS_SERVICE" \
            --worker-service "$WORKER_ECS_SERVICE" \
            --inference-queue-url "$INFERENCE_QUEUE_URL" \
            --dead-letter-queue-url "$DEAD_LETTER_QUEUE_URL" \
            --alarm-name-prefix "$ALARM_NAME_PREFIX" \
            --audit-trail-name "$AUDIT_TRAIL_NAME" \
            --backup-vault-name "$BACKUP_VAULT_NAME" \
            --restore-testing-plan-arn "$RESTORE_TESTING_PLAN_ARN" \
            --codedeploy-application "$CODEDEPLOY_APPLICATION" \
            --codedeploy-deployment-group "$CODEDEPLOY_DEPLOYMENT_GROUP" \
            --output production-diagnostics.json

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-diagnostics-${{ inputs.incident_id }}-${{ github.run_id }}
          path: production-diagnostics.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish incident summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Production incident diagnostics"
            echo "- Incident: `${INCIDENT_ID}`"
            echo "- Lookback: `${LOOKBACK_HOURS} hours`"
            echo "- Credentials: **read-only production-operations role**"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
