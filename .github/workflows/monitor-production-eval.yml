name: Monitor Production Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-production-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/master'
    environment: production-monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_EVALUATION_ROLE_ARN: ${{ vars.AWS_EVALUATION_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PAGER: ""
      API_URL: ${{ vars.API_URL }}
      API_AUTH_SECRET_ID: ${{ vars.API_AUTH_SECRET_ID }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

    steps:
      - name: Check out monitored revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install evaluation runtime
        run: python -m pip install --disable-pip-version-check -r services/api/requirements.txt

      - name: Configure evaluation-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_EVALUATION_ROLE_ARN }}
          role-session-name: production-eval-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Read and mask production API token
        shell: bash
        run: |
          set -euo pipefail
          token=$(aws secretsmanager get-secret-value --secret-id "$API_AUTH_SECRET_ID" --query SecretString --output text)
          [[ "$token" =~ ^[A-Za-z0-9_-]{32,128}$ ]] || { echo "Production API token is missing or malformed" >&2; exit 1; }
          echo "::add-mask::$token"
          echo "EVAL_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Evaluate production and publish evidence
        run: >-
          python -m evals.monitor_production
          --base-url "$API_URL"
          --artifact-bucket "$ARTIFACT_BUCKET"
          --environment production
          --revision "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Publish monitoring summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Continuous production evaluation"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Evidence prefix: \`s3://${ARTIFACT_BUCKET}/evaluations/production/\`"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
