name: CI
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: pip install -r services/api/requirements-dev.txt ruff pip-audit
      - name: Lint
        run: ruff check services/api services/common services/worker evals .github/tests
      - name: Unit tests
        run: PYTHONPATH=services/api pytest services/api/tests services/worker/tests evals .github/tests
      - name: LLM evaluation quality gate
        run: python -m evals.run_eval
      - name: Dependency security scan
        run: |
          pip-audit -r services/api/requirements-dev.txt
          pip-audit -r services/worker/requirements.txt

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Terraform format
        run: terraform fmt -check -recursive terraform
      - name: Terraform initialize
        run: terraform -chdir=terraform/environments/${{ matrix.environment }} init -backend=false -input=false -lockfile=readonly
      - name: Terraform validate
        run: terraform -chdir=terraform/environments/${{ matrix.environment }} validate
      - name: Terraform module tests
        run: terraform -chdir=terraform/environments/${{ matrix.environment }} test
