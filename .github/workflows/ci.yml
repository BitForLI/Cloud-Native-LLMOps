name: CI
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt ruff pip-audit
      - name: Lint
        run: ruff check services/api evals
      - name: Unit tests
        run: PYTHONPATH=services/api pytest services/api/tests evals/test_eval.py
      - name: LLM evaluation quality gate
        run: python -m evals.run_eval
      - name: Dependency security scan
        run: pip-audit -r services/api/requirements.txt
