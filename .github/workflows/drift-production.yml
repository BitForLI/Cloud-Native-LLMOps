name: Audit Production Drift
run-name: Production Drift ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-drift
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/master'
    environment: production-drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DRIFT_ROLE_ARN: ${{ vars.AWS_DRIFT_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PAGER: ""
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_BACKEND_KEY: ${{ vars.TF_BACKEND_KEY }}
      PRODUCTION_TFVARS_JSON: ${{ secrets.PRODUCTION_TFVARS_JSON }}

    steps:
      - name: Check out audited configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate audit configuration
        shell: bash
        run: |
          set -euo pipefail
          for required in AWS_ACCOUNT_ID AWS_DRIFT_ROLE_ARN AWS_REGION TF_BACKEND_BUCKET TF_BACKEND_KEY PRODUCTION_TFVARS_JSON; do
            [[ -n "${!required:-}" ]] || { echo "Missing production-drift configuration: ${required}" >&2; exit 1; }
          done
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_DRIFT_ROLE_ARN" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/"* ]]
          [[ "$TF_BACKEND_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$TF_BACKEND_KEY" != /* && "$TF_BACKEND_KEY" != *".."* && "$TF_BACKEND_KEY" != *"*"* ]]
          jq -e 'type == "object"' <<<"$PRODUCTION_TFVARS_JSON" >/dev/null

      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Configure read-only production credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_DRIFT_ROLE_ARN }}
          role-session-name: drift-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Initialize exact production backend
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PRODUCTION_TFVARS_JSON" > "$RUNNER_TEMP/production.tfvars.json"
          terraform -chdir=terraform/environments/production init \
            -input=false \
            -lockfile=readonly \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Calculate read-only production plan
        id: plan
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          terraform -chdir=terraform/environments/production plan \
            -detailed-exitcode \
            -input=false \
            -lock=false \
            -no-color \
            -var-file="$RUNNER_TEMP/production.tfvars.json" \
            -out="$RUNNER_TEMP/production.tfplan" \
            >"$RUNNER_TEMP/production-plan.log" 2>&1
          code=$?
          set -e
          case "$code" in
            0) status=clean ;;
            2) status=drift ;;
            *) status=error ;;
          esac
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "Terraform production audit status: ${status}"

      - name: Build value-free policy report
        if: always()
        shell: bash
        env:
          PLAN_STATUS: ${{ steps.plan.outputs.status }}
        run: |
          set -euo pipefail
          status=${PLAN_STATUS:-error}
          if [[ "$status" == "clean" || "$status" == "drift" ]]; then
            terraform -chdir=terraform/environments/production show -json "$RUNNER_TEMP/production.tfplan" > "$RUNNER_TEMP/production-plan-values.json"
            python .github/scripts/summarize_terraform_plan.py \
              --plan "$RUNNER_TEMP/production-plan-values.json" \
              --status "$status" \
              --revision "$GITHUB_SHA" \
              --output artifacts/production-drift-report.json
          else
            python .github/scripts/summarize_terraform_plan.py \
              --status error \
              --revision "$GITHUB_SHA" \
              --output artifacts/production-drift-report.json
          fi

      - name: Publish binary drift signal
        if: always()
        shell: bash
        env:
          PLAN_STATUS: ${{ steps.plan.outputs.status }}
        run: |
          set -euo pipefail
          signal=1
          [[ "${PLAN_STATUS:-error}" == "clean" ]] && signal=0
          aws cloudwatch put-metric-data \
            --namespace CloudNativeLLMOps \
            --metric-data \
              "MetricName=InfrastructureDriftDetected,Dimensions=[{Name=Environment,Value=production}],Value=${signal},Unit=Count" \
              "MetricName=InfrastructureDriftAuditHeartbeat,Dimensions=[{Name=Environment,Value=production}],Value=1,Unit=Count"

      - name: Retain sanitized drift evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-drift-${{ github.run_id }}
          path: artifacts/production-drift-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          status=$(jq -r '.plan_status // "error"' artifacts/production-drift-report.json 2>/dev/null || echo error)
          changes=$(jq -r '.summary.changed_resources // 0' artifacts/production-drift-report.json 2>/dev/null || echo 0)
          outputs=$(jq -r '.summary.changed_outputs // 0' artifacts/production-drift-report.json 2>/dev/null || echo 0)
          {
            echo "### Production Terraform drift"
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Status: **${status}**"
            echo "- Changed resources: **${changes}**"
            echo "- Changed outputs: **${outputs}**"
            echo "- Evidence: value-free JSON artifact retained for 90 days"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce drift policy
        if: always()
        shell: bash
        run: |
          jq -e '.passed == true' artifacts/production-drift-report.json >/dev/null
