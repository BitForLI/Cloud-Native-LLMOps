name: cloud-native-llmops

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      JOB_BACKEND: ${JOB_BACKEND:-memory}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      JOB_TABLE_NAME: ${JOB_TABLE_NAME:-}
      INFERENCE_QUEUE_URL: ${INFERENCE_QUEUE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JOB_MAX_WORKERS: ${JOB_MAX_WORKERS:-2}
      JOB_MAX_PENDING: ${JOB_MAX_PENDING:-100}
      JOB_MAX_STORED: ${JOB_MAX_STORED:-1000}
      JOB_POLL_INTERVAL_SECONDS: ${JOB_POLL_INTERVAL_SECONDS:-0.25}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; raise SystemExit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - backend

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      JOB_BACKEND: ${JOB_BACKEND:-memory}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      JOB_TABLE_NAME: ${JOB_TABLE_NAME:-}
      INFERENCE_QUEUE_URL: ${INFERENCE_QUEUE_URL:-}
      JOB_MAX_RECEIVE_COUNT: ${JOB_MAX_RECEIVE_COUNT:-5}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-20}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JOB_MAX_WORKERS: ${JOB_MAX_WORKERS:-2}
      JOB_MAX_PENDING: ${JOB_MAX_PENDING:-100}
      JOB_MAX_STORED: ${JOB_MAX_STORED:-1000}
      JOB_POLL_INTERVAL_SECONDS: ${JOB_POLL_INTERVAL_SECONDS:-0.25}
      WORKER_HEARTBEAT_PATH: /tmp/llmops-worker-heartbeat
      WORKER_HEARTBEAT_INTERVAL_SECONDS: 30
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: 90
    healthcheck:
      test: ["CMD", "python", "-m", "services.worker.healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - backend

networks:
  backend:
    driver: bridge
